[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "xming", email = "1@2.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.141.1",
    "httpx>=0.27.0",
    "pydantic-settings>=2.15.0",
    "pymysql>=1.1",
    "sqlalchemy>=2.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
backend = "app.main:app"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = "."

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort(import 排序),
# B: flake8-bugbear(常见bug), UP: pyupgrade(现代化写法)
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"

