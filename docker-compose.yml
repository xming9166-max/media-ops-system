# 本地开发依赖服务(生产由部署环境管理,不使用本文件)
#
# 启动: docker compose up -d
# 停止: docker compose down
# 清空数据: docker compose down -v

services:
  mysql:
    image: mysql:8.0
    container_name: media-ops-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: media_ops
      MYSQL_USER: media
      MYSQL_PASSWORD: media
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 预留:WP-2/3 启用 Redis + Celery broker
  # redis:
  #   image: redis:7
  #   container_name: media-ops-redis
  #   ports:
  #     - "6379:6379"

volumes:
  mysql_data:
